
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Sinuca 8 Bolas</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #111;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Segoe UI', system-ui, sans-serif;
            overflow: hidden;
            color: #eee;
        }
        #game-container {
            display: flex;
            box-shadow: 0 0 50px rgba(0,0,0,0.9);
            border-radius: 12px;
            overflow: hidden;
            background: #0d0d0d;
        }
        #sidebar {
            width: 180px;
            background: linear-gradient(180deg, #1f1f1f, #121212);
            padding: 18px 14px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            border-right: 3px solid #333;
        }
        #sidebar h2 {
            font-size: 17px;
            text-align: center;
            letter-spacing: 1px;
            margin-bottom: 18px;
            color: #f0f0f0;
            line-height: 1.3;
        }
        .score-block {
            background: rgba(255,255,255,0.05);
            border-radius: 10px;
            padding: 12px 10px;
            margin-bottom: 12px;
            text-align: center;
        }
        .score-block .label {
            font-size: 11px;
            color: #999;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 3px;
        }
        .score-block .value {
            font-size: 26px;
            font-weight: 700;
        }
        #current-player {
            font-size: 18px;
            font-weight: 700;
            margin-top: 4px;
        }
        #group-info {
            font-size: 13px;
            margin-top: 6px;
            color: #bbb;
        }
        .player-info {
            font-size: 12px;
            margin-top: 8px;
            line-height: 1.5;
            color: #aaa;
        }
        #instructions {
            font-size: 11px;
            color: #777;
            text-align: center;
            line-height: 1.55;
        }
        #instructions strong { color: #ccc; }
        .canvas-wrapper { position: relative; }
        canvas {
            display: block;
            background: #0a3a0a;
            cursor: crosshair;
            touch-action: none;
        }
        #win-message {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.94);
            color: #fff;
            font-size: 28px;
            font-weight: 700;
            text-align: center;
            padding: 28px 42px;
            border-radius: 16px;
            display: none;
            z-index: 30;
            box-shadow: 0 0 40px rgba(0,0,0,0.8);
            line-height: 1.4;
        }
        #foul-message {
            position: absolute;
            top: 70px; left: 50%;
            transform: translateX(-50%);
            background: #c62828;
            color: #fff;
            font-size: 26px;
            font-weight: 700;
            padding: 10px 36px;
            border-radius: 10px;
            display: none;
            z-index: 25;
            letter-spacing: 3px;
            box-shadow: 0 0 25px #c62828;
        }
    </style>
</head>
<body>
<div id="game-container">
    <div id="sidebar">
        <div>
            <h2>SINUCA<br>8 BOLAS</h2>

            <div class="score-block">
                <div class="label">Vez de</div>
                <div id="current-player">Jogador 1</div>
                <div id="group-info">Mesa Aberta</div>
            </div>

            <div class="score-block">
                <div class="label">Jogador 1</div>
                <div class="player-info" id="p1-info">—</div>
            </div>

            <div class="score-block">
                <div class="label">Jogador 2</div>
                <div class="player-info" id="p2-info">—</div>
            </div>
        </div>

        <div id="instructions">
            Arraste a partir da bola branca<br>
            <strong>R</strong> = Reiniciar<br>
            <strong>Espaço</strong> = Passar vez
        </div>
    </div>

    <div class="canvas-wrapper">
        <canvas id="canvas" width="900" height="500"></canvas>
        <div id="win-message"></div>
        <div id="foul-message">FOUL!</div>
    </div>
</div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const winMessage = document.getElementById('win-message');
const foulMessage = document.getElementById('foul-message');

const W = 900, H = 500;
const BORDER = 38;
const BALL_R = 13.5;
const POCKET_R = 24;
const FRICTION = 0.985;
const MIN_SPEED = 0.07;

let balls = [];
let cueBall = null;
let isAiming = false;
let aimX = 0, aimY = 0;
let currentPlayer = 1;
let gameWon = false;
let playerGroups = { 1: null, 2: null }; // 'solid' | 'stripe'
let shotActive = false;
let shotSunkOwn = 0;
let shotCueSunk = false;
let shotEightSunk = false;
let firstContact = null; // para regra de mesa aberta (simplificado)

const pockets = [
    {x: BORDER, y: BORDER},
    {x: W/2, y: BORDER},
    {x: W - BORDER, y: BORDER},
    {x: BORDER, y: H - BORDER},
    {x: W/2, y: H - BORDER},
    {x: W - BORDER, y: H - BORDER}
];

// Cores oficiais aproximadas
const COLORS = {
    0: '#f5f5f5',
    1: '#e74c3c', 2: '#f39c12', 3: '#f1c40f', 4: '#27ae60',
    5: '#3498db', 6: '#8e44ad', 7: '#c0392b',
    8: '#111111',
    9: '#e74c3c', 10: '#f39c12', 11: '#f1c40f', 12: '#27ae60',
    13: '#3498db', 14: '#8e44ad', 15: '#c0392b'
};

class Ball {
    constructor(x, y, num) {
        this.x = x;
        this.y = y;
        this.vx = 0;
        this.vy = 0;
        this.number = num;
        this.r = BALL_R;
        this.sunk = false;
        this.isStripe = num >= 9;
    }

    update() {
        if (this.sunk) return;
        this.x += this.vx;
        this.y += this.vy;
        this.vx *= FRICTION;
        this.vy *= FRICTION;
        if (Math.abs(this.vx) < MIN_SPEED) this.vx = 0;
        if (Math.abs(this.vy) < MIN_SPEED) this.vy = 0;

        // Bordas
        if (this.x - this.r < BORDER) {
            this.x = BORDER + this.r;
            this.vx = -this.vx * 0.85;
        }
        if (this.x + this.r > W - BORDER) {
            this.x = W - BORDER - this.r;
            this.vx = -this.vx * 0.85;
        }
        if (this.y - this.r < BORDER) {
            this.y = BORDER + this.r;
            this.vy = -this.vy * 0.85;
        }
        if (this.y + this.r > H - BORDER) {
            this.y = H - BORDER - this.r;
            this.vy = -this.vy * 0.85;
        }
    }

    draw() {
        if (this.sunk) return;

        const speed = Math.hypot(this.vx, this.vy);

        // Sombra
        ctx.shadowColor = 'rgba(0,0,0,0.7)';
        ctx.shadowBlur = 14;
        ctx.shadowOffsetX = 5;
        ctx.shadowOffsetY = 6;

        ctx.beginPath();
        ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2);

        if (this.isStripe) {
            // Fundo branco
            ctx.fillStyle = '#f8f8f8';
            ctx.fill();
            // Faixa colorida
            ctx.save();
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2);
            ctx.clip();
            ctx.fillStyle = COLORS[this.number];
            ctx.fillRect(this.x - this.r, this.y - this.r * 0.55, this.r * 2, this.r * 1.1);
            ctx.restore();
        } else {
            ctx.fillStyle = COLORS[this.number] || '#111';
            ctx.fill();
        }

        ctx.shadowBlur = 0;

        // Brilho
        ctx.fillStyle = `rgba(255,255,255,${0.45 + speed * 0.03})`;
        ctx.beginPath();
        ctx.arc(this.x - 5, this.y - 6, 6.5, 0, Math.PI * 2);
        ctx.fill();

        // Número
        if (this.number > 0) {
            ctx.fillStyle = (this.number === 8 || this.isStripe) ? '#111' : '#fff';
            if (this.isStripe) {
                // círculo branco atrás do número
                ctx.beginPath();
                ctx.arc(this.x, this.y, 7.5, 0, Math.PI * 2);
                ctx.fillStyle = '#fff';
                ctx.fill();
                ctx.fillStyle = '#111';
            }
            ctx.font = 'bold 12px Arial';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(this.number, this.x, this.y + 1);
        }
    }
}

function createBalls() {
    balls = [];
    currentPlayer = 1;
    gameWon = false;
    playerGroups = { 1: null, 2: null };
    shotActive = false;
    shotSunkOwn = 0;
    shotCueSunk = false;
    shotEightSunk = false;
    firstContact = null;
    winMessage.style.display = 'none';
    foulMessage.style.display = 'none';

    // Bola branca
    cueBall = new Ball(220, H / 2, 0);
    balls.push(cueBall);

    // Rack clássico de 15 bolas
    const rackX = 640;
    const rackY = H / 2;
    const gap = BALL_R * 2.05;

    // Ordem aproximada do triângulo (8 no centro)
    const order = [
        1,
        9, 2,
        10, 8, 3,
        11, 4, 12, 5,
        13, 6, 14, 7, 15
    ];

    let idx = 0;
    for (let row = 0; row < 5; row++) {
        for (let col = 0; col <= row; col++) {
            const x = rackX + row * gap * 0.875;
            const y = rackY + (col - row / 2) * gap;
            balls.push(new Ball(x, y, order[idx++]));
        }
    }

    updateUI();
}

function countRemaining(group) {
    if (!group) return 7;
    return balls.filter(b => !b.sunk && b.number !== 0 && b.number !== 8 &&
        ((group === 'solid' && b.number <= 7) || (group === 'stripe' && b.number >= 9))
    ).length;
}

function updateUI() {
    const playerEl = document.getElementById('current-player');
    playerEl.textContent = `Jogador ${currentPlayer}`;
    playerEl.style.color = currentPlayer === 1 ? '#4fc3f7' : '#ff9800';

    const group = playerGroups[currentPlayer];
    document.getElementById('group-info').textContent = group
        ? (group === 'solid' ? '● Sólidas' : '▥ Listadas')
        : 'Mesa Aberta';

    const g1 = playerGroups[1];
    const g2 = playerGroups[2];
    document.getElementById('p1-info').innerHTML = g1
        ? `${g1 === 'solid' ? '● Sólidas' : '▥ Listadas'} • ${countRemaining(g1)} restantes`
        : '—';
    document.getElementById('p2-info').innerHTML = g2
        ? `${g2 === 'solid' ? '● Sólidas' : '▥ Listadas'} • ${countRemaining(g2)} restantes`
        : '—';
}

const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
function playSound(freq, dur, type = 'triangle', vol = 0.55) {
    try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(vol, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
        osc.connect(gain).connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + dur + 0.05);
    } catch(e) {}
}

function drawTable() {
    // Feltro
    const grad = ctx.createLinearGradient(0, 0, 0, H);
    grad.addColorStop(0, '#0b4a0b');
    grad.addColorStop(1, '#083808');
    ctx.fillStyle = grad;
    ctx.fillRect(BORDER, BORDER, W - BORDER * 2, H - BORDER * 2);

    // Bordas de madeira
    ctx.strokeStyle = '#3a2415';
    ctx.lineWidth = 40;
    ctx.strokeRect(BORDER / 2, BORDER / 2, W - BORDER, H - BORDER);

    // Linha do meio
    ctx.strokeStyle = 'rgba(255,255,255,0.12)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(W / 2, BORDER + 12);
    ctx.lineTo(W / 2, H - BORDER - 12);
    ctx.stroke();

    // Caçapas
    ctx.fillStyle = '#0a0a0a';
    pockets.forEach(p => {
        ctx.beginPath();
        ctx.arc(p.x, p.y, POCKET_R, 0, Math.PI * 2);
        ctx.fill();
    });
}

function resolveCollision(a, b) {
    const dx = b.x - a.x;
    const dy = b.y - a.y;
    const dist = Math.hypot(dx, dy);
    if (dist === 0 || dist >= a.r + b.r) return;

    const nx = dx / dist;
    const ny = dy / dist;

    // Separar
    const overlap = (a.r + b.r - dist) / 2;
    a.x -= nx * overlap;
    a.y -= ny * overlap;
    b.x += nx * overlap;
    b.y += ny * overlap;

    // Velocidades relativas
    const dvx = a.vx - b.vx;
    const dvy = a.vy - b.vy;
    const dvn = dvx * nx + dvy * ny;
    if (dvn > 0) return; // já se afastando

    // Impulso elástico
    const impulse = dvn * 0.96;
    a.vx -= impulse * nx;
    a.vy -= impulse * ny;
    b.vx += impulse * nx;
    b.vy += impulse * ny;

    const speed = Math.hypot(a.vx, a.vy) + Math.hypot(b.vx, b.vy);
    playSound(90 + speed * 8, 0.12, 'triangle', Math.min(0.7, speed / 25));
}

function checkCollisions() {
    for (let i = 0; i < balls.length; i++) {
        for (let j = i + 1; j < balls.length; j++) {
            const a = balls[i], b = balls[j];
            if (a.sunk || b.sunk) continue;
            resolveCollision(a, b);
        }
    }
}

function checkPockets() {
    for (const ball of balls) {
        if (ball.sunk) continue;
        for (const p of pockets) {
            if (Math.hypot(ball.x - p.x, ball.y - p.y) < POCKET_R - 4) {
                ball.sunk = true;
                ball.vx = ball.vy = 0;

                if (ball.number === 0) {
                    shotCueSunk = true;
                    playSound(160, 0.5, 'sine', 0.5);
                    // reposiciona depois
                } else if (ball.number === 8) {
                    shotEightSunk = true;
                    playSound(55, 0.7, 'sine', 0.9);
                } else {
                    playSound(70, 0.45, 'sine', 0.75);

                    // Atribui grupos na primeira bola válida
                    if (!playerGroups[1] && !playerGroups[2]) {
                        const isSolid = ball.number <= 7;
                        playerGroups[currentPlayer] = isSolid ? 'solid' : 'stripe';
                        playerGroups[currentPlayer === 1 ? 2 : 1] = isSolid ? 'stripe' : 'solid';
                    }

                    const group = playerGroups[currentPlayer];
                    const isOwn = !group ||
                        (group === 'solid' && ball.number <= 7) ||
                        (group === 'stripe' && ball.number >= 9);

                    if (isOwn) shotSunkOwn++;
                }
                break;
            }
        }
    }
}

function respawnCue() {
    if (!cueBall) return;
    cueBall.x = 220;
    cueBall.y = H / 2;
    cueBall.vx = cueBall.vy = 0;
    cueBall.sunk = false;

    // Evita sobreposição
    let tries = 0;
    while (tries < 20) {
        let ok = true;
        for (const b of balls) {
            if (b === cueBall || b.sunk) continue;
            if (Math.hypot(cueBall.x - b.x, cueBall.y - b.y) < BALL_R * 2.1) {
                ok = false;
                cueBall.y += 18;
                if (cueBall.y > H - BORDER - 30) cueBall.y = BORDER + 40;
                break;
            }
        }
        if (ok) break;
        tries++;
    }
}

function allStopped() {
    return balls.every(b => b.sunk || (Math.abs(b.vx) < 0.12 && Math.abs(b.vy) < 0.12));
}

function drawCue() {
    if (!isAiming || !cueBall || cueBall.sunk) return;

    const dx = cueBall.x - aimX;
    const dy = cueBall.y - aimY;
    const dist = Math.hypot(dx, dy);
    const power = Math.min(dist / 5.2, 100);
    const angle = Math.atan2(dy, dx);
    const cos = Math.cos(angle);
    const sin = Math.sin(angle);

    // Taco
    ctx.strokeStyle = '#c4a574';
    ctx.lineWidth = 6.5;
    ctx.lineCap = 'round';
    ctx.shadowBlur = 12;
    ctx.shadowColor = 'rgba(0,0,0,0.7)';
    ctx.beginPath();
    ctx.moveTo(cueBall.x - cos * 28, cueBall.y - sin * 28);
    ctx.lineTo(cueBall.x - cos * (75 + power * 2.1), cueBall.y - sin * (75 + power * 2.1));
    ctx.stroke();
    ctx.shadowBlur = 0;

    // Ponta
    ctx.strokeStyle = '#eee';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(cueBall.x - cos * 30, cueBall.y - sin * 30);
    ctx.lineTo(cueBall.x - cos * 42, cueBall.y - sin * 42);
    ctx.stroke();

    // Linha de mira
    ctx.strokeStyle = `rgba(255, 240, 120, ${0.65 - power / 220})`;
    ctx.lineWidth = 1.8;
    ctx.setLineDash([5, 18]);
    ctx.beginPath();
    ctx.moveTo(cueBall.x, cueBall.y);
    ctx.lineTo(cueBall.x + cos * 900, cueBall.y + sin * 900);
    ctx.stroke();
    ctx.setLineDash([]);

    // Barra de força
    const barW = 46, barH = 7;
    ctx.fillStyle = '#111';
    ctx.fillRect(cueBall.x - barW/2 - 1, cueBall.y - 48, barW + 2, barH + 2);
    ctx.fillStyle = power > 80 ? '#ff3333' : power > 50 ? '#ffaa00' : '#4caf50';
    ctx.fillRect(cueBall.x - barW/2, cueBall.y - 47, barW * (power / 100), barH);
}

function showFoul() {
    foulMessage.style.display = 'block';
    setTimeout(() => foulMessage.style.display = 'none', 1300);
}

function switchPlayer() {
    currentPlayer = currentPlayer === 1 ? 2 : 1;
    updateUI();
}

function checkWin() {
    if (gameWon) return;
    const eight = balls.find(b => b.number === 8);
    if (!eight || !eight.sunk) return;

    const group = playerGroups[currentPlayer];
    const stillHasOwn = group && balls.some(b =>
        !b.sunk && b.number !== 0 && b.number !== 8 &&
        ((group === 'solid' && b.number <= 7) || (group === 'stripe' && b.number >= 9))
    );

    gameWon = true;
    winMessage.style.color = currentPlayer === 1 ? '#4fc3f7' : '#ff9800';

    if (shotCueSunk || stillHasOwn) {
        // perdeu (8 cedo ou scratch no 8)
        winMessage.innerHTML = `❌ JOGADOR ${currentPlayer}<br>PERDEU`;
    } else {
        winMessage.innerHTML = `🎉 JOGADOR ${currentPlayer}<br>VENCEU!`;
    }
    winMessage.style.display = 'block';
    setTimeout(createBalls, 4800);
}

function endShot() {
    if (!shotActive) return;
    shotActive = false;

    if (shotCueSunk) {
        showFoul();
        respawnCue();
        switchPlayer();
    } else if (shotSunkOwn === 0) {
        switchPlayer();
    }
    // se encaçou bola própria, continua

    checkWin();
    shotSunkOwn = 0;
    shotCueSunk = false;
    shotEightSunk = false;
    updateUI();
}

function gameLoop() {
    ctx.clearRect(0, 0, W, H);
    drawTable();

    for (const b of balls) {
        b.update();
        b.draw();
    }

    checkCollisions();
    checkPockets();

    if (isAiming) drawCue();

    if (shotActive && allStopped() && !gameWon) {
        endShot();
    }

    requestAnimationFrame(gameLoop);
}

function getPos(e) {
    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width / rect.width;
    const scaleY = canvas.height / rect.height;
    const clientX = e.clientX ?? e.touches?.[0]?.clientX ?? e.changedTouches?.[0]?.clientX;
    const clientY = e.clientY ?? e.touches?.[0]?.clientY ?? e.changedTouches?.[0]?.clientY;
    return {
        x: (clientX - rect.left) * scaleX,
        y: (clientY - rect.top) * scaleY
    };
}

function startAim(e) {
    if (gameWon || !cueBall || !allStopped() || cueBall.sunk || shotActive) return;
    isAiming = true;
    const p = getPos(e);
    aimX = p.x;
    aimY = p.y;
}

function moveAim(e) {
    if (!isAiming) return;
    const p = getPos(e);
    aimX = p.x;
    aimY = p.y;
}

function shoot(e) {
    if (!isAiming || !cueBall) return;
    const p = getPos(e);
    const dx = cueBall.x - p.x;
    const dy = cueBall.y - p.y;
    const power = Math.min(Math.hypot(dx, dy) / 5.2, 100);
    const force = power * 0.155;

    cueBall.vx = (dx / Math.hypot(dx, dy) || 0) * force;
    cueBall.vy = (dy / Math.hypot(dx, dy) || 0) * force;

    isAiming = false;
    shotActive = true;
    shotSunkOwn = 0;
    shotCueSunk = false;
    shotEightSunk = false;
    playSound(40 + power * 1.2, 0.08, 'sine', 0.35);
}

// Eventos
['mousedown', 'touchstart'].forEach(ev => {
    canvas.addEventListener(ev, e => {
        e.preventDefault();
        startAim(e);
    }, { passive: false });
});

canvas.addEventListener('mousemove', moveAim);
canvas.addEventListener('touchmove', e => {
    e.preventDefault();
    moveAim(e);
}, { passive: false });

['mouseup', 'touchend'].forEach(ev => {
    canvas.addEventListener(ev, e => {
        e.preventDefault();
        shoot(e);
    }, { passive: false });
});

document.addEventListener('keydown', e => {
    if (e.key.toLowerCase() === 'r') createBalls();
    if (e.key === ' ' && allStopped() && !shotActive && !gameWon) {
        e.preventDefault();
        switchPlayer();
    }
});

createBalls();
gameLoop();
</script>
</body>
</html>
